# Smoke-test the default game, export both web builds and deploy them to
# Cloudflare Pages: the default game at the root, legacy under /legacy/.
name: Web build

on:
  push:
    branches: [main]
    paths:
      - assets/**
      - data/**
      - scenes/**
      - scripts/**
      - tools/smoke_*.gd
      - project.godot
      - export_presets.cfg
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # testing/ holds ~300 MB of parity evidence the game never loads; tools/
      # is needed only for the smoke test, which does not ship.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            assets
            data
            scenes
            scripts
            tools
            web

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip

      - name: Cache web export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-templates-${{ env.GODOT_VERSION }}-threads

      - name: Install web export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$dest"
          # Both variants: the threaded one is used once the host sends the
          # cross-origin isolation headers (Cloudflare does; GitHub Pages cannot).
          unzip -j templates.tpz templates/version.txt templates/web_nothreads_release.zip templates/web_release.zip -d "$dest"
          rm templates.tpz

      # Built by .github/workflows/engine.yml: no 3D, size-optimised, so the
      # engine fits under Cloudflare Pages' 25 MiB per-file limit.
      - name: Use the slim engine if published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if gh release download engine-slim --pattern web_nothreads_release.zip --output slim.zip --clobber; then
            mv slim.zip "$dest/web_nothreads_release.zip"
            echo "using the slim engine"
          else
            echo "slim engine not published yet; using the stock template"
          fi

      - name: Import
        run: |
          "$RUNNER_TEMP/godot" --headless --import

      # The demo parity suite covers legacy only (it needs testing/ and a GPU).
      # This is the default game's gate: it runs, and motion is drawn smoothly.
      - name: Smoke-test the default game
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/godot" --headless --fixed-fps 120 --path . --script tools/smoke_default_game.gd -- --original-seed 20716
          "$RUNNER_TEMP/godot" --headless --fixed-fps 120 --path . --script tools/smoke_default_game.gd -- --replay data/wr1/demos/level1.json

      - name: Export
        run: |
          mkdir -p build/web/legacy
          "$RUNNER_TEMP/godot" --headless --export-release "Web" build/web/index.html
          "$RUNNER_TEMP/godot" --headless --export-release "Web Legacy" build/web/legacy/index.html
          test -s build/web/index.pck && test -s build/web/legacy/index.pck
          # Cross-origin isolation and cache rules for Cloudflare Pages.
          cp web/_headers build/web/_headers

      # wr.polarquake.com. Uses the CLOUDFLARE_API_TOKEN (Pages:Edit) and
      # CLOUDFLARE_ACCOUNT_ID secrets; infra/ creates the project.
      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
