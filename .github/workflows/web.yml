# Smoke-test the default game, export both web builds and publish them to
# GitHub Pages: the default game at the root, legacy under /legacy/.
name: Web build

on:
  push:
    branches: [main]
    paths:
      - assets/**
      - data/**
      - scenes/**
      - scripts/**
      - tools/smoke_*.gd
      - project.godot
      - export_presets.cfg
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # testing/ holds ~300 MB of parity evidence the game never loads; tools/
      # is needed only for the smoke test, which does not ship.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            assets
            data
            scenes
            scripts
            tools

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip

      - name: Cache web export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Install web export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$dest"
          unzip -j templates.tpz templates/version.txt templates/web_nothreads_release.zip -d "$dest"
          rm templates.tpz

      - name: Import
        run: "$RUNNER_TEMP/godot" --headless --import

      # The demo parity suite covers legacy only (it needs testing/ and a GPU).
      # This is the default game's gate: it runs, and motion is drawn smoothly.
      - name: Smoke-test the default game
        run: |
          "$RUNNER_TEMP/godot" --headless --fixed-fps 120 --path . --script tools/smoke_default_game.gd
          "$RUNNER_TEMP/godot" --headless --fixed-fps 120 --path . --script tools/smoke_default_game.gd -- --replay data/wr1/demos/level1.json

      - name: Export
        run: |
          mkdir -p build/web/legacy
          "$RUNNER_TEMP/godot" --headless --export-release "Web" build/web/index.html
          "$RUNNER_TEMP/godot" --headless --export-release "Web Legacy" build/web/legacy/index.html
          test -s build/web/index.pck && test -s build/web/legacy/index.pck

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
