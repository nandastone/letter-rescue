# RetroArch config for Word Rescue visual regression testing.
# Minimal config: no menus, no overlays, deterministic output.

# Video — match DOSBox native resolution.
video_fullscreen = "false"
video_windowed_fullscreen = "false"
video_scale = 2
video_smooth = "false"
video_shader_enable = "false"
video_vsync = "false"

# Force integer scaling for pixel-perfect output.
video_scale_integer = "true"

# Use software filter (nearest neighbor) to preserve pixels.
video_ctx_scaling = "false"

# Audio — keep enabled for game timing but don't record it.
audio_enable = "true"

# Input — keyboard only, generic keyboard bindings for DOSBox Pure.
input_max_users = "1"

# Disable RetroArch hotkeys that collide with the game's own keys.
# Space is "slime" in Word Rescue; default RetroArch binds it to Fast-Forward Hold,
# which also suppresses frame recording while held — silently producing empty videos.
input_hold_fast_forward = "nul"
input_toggle_fast_forward = "nul"
input_rewind = "nul"
input_slowmotion = "nul"
input_hold_slowmotion = "nul"

# Auto-save/load state disabled (BSV handles state).
savestate_auto_load = "false"
savestate_auto_save = "false"

# No menu on startup — go straight to game.
rgui_show_start_screen = "false"

# Recording settings.
# `video_gpu_record = false` records the core's software framebuffer directly
# (DOSBox Pure is software-rendered, so this is what we want).
# `video_record_quality = 4` is the LOSSLESS preset (FFV1). Required for
# pixel-exact testing — anything less re-encodes via lossy x264 and destroys
# byte-identical pixel comparison. The enum only accepts 0-9; the old "10"
# silently fell back to a lossy default.
video_gpu_record = "false"
video_record_quality = "4"

# Pause on focus loss disabled (for automation).
pause_nonactive = "false"

# Rewind disabled (interferes with replay determinism).
rewind_enable = "false"

# Frame limiter — run at native speed for recording.
fastforward_ratio = "0.0"

# Paths.
system_directory = ""
savefile_directory = ""
savestate_directory = ""
